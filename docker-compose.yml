version: '3.9'

services:
  laravel-app:
    image: apurva19989432/hackathon-sap-sol-laravel:latest
    container_name: laravel-app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      # Keep this in sync with your Laravel config/services.php
      AGENT_URL: "http://agent-service:9000"
    depends_on:
      - agent-service

  agent-service:
    image: apurva19989432/hackathon-sap-sol-agent:latest
    container_name: agent-service
    ports:
      - "9000:9000"
    environment:
    GROQ_API_KEY: "REPLACE_WITH_YOUR_REAL_GROQ_KEY_Because_We_Should_Not_Give_API_Keys_In_Code"